name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} / Qt ${{ matrix.qt }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        # Two Qt releases on purpose: the LTS that release artefacts are built against,
        # and the newest release a current rolling-release desktop is likely to run.
        #
        # 6.10.3 rather than 6.11.x because Qt moved the Windows repository to
        # per-architecture directories in 6.11 (qt6_6112/qt6_6112_msvc2022_64/Updates.xml
        # instead of qt6_6112/qt6_6112/Updates.xml), and the aqtinstall version pinned by
        # the action (3.3.*) only reads the flat layout. It happily lists 6.11.2 and then
        # fails with "Failed to locate XML data for Qt version". Raise aqtversion at the
        # same time as this list.
        qt: ["6.8.3", "6.10.3"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          modules: "qt5compat qtshadertools"
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev

      - name: Check formatting
        run: cargo fmt --check

      - name: Build (release)
        run: cargo build --release
